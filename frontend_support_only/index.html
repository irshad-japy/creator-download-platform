<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Support the creator using UPI or Patreon." />
  <title>Support the Creator</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./config.js"></script>
</head>
<body class="min-h-screen bg-black text-gray-100 font-sans flex items-center justify-center p-4">
  <div
     class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-2xl max-w-2xl w-full text-center space-y-4">
      <h3 class="text-xl font-bold text-indigo-400">Keep me motivated(Support INR 5/INR 10...INR 100) ❤️</h3>
      <p class="text-gray-300 text-xs">Choose your preferred payment method below:</p>

      <div class="space-y-3 text-left bg-gray-800/80 p-4 rounded-xl border border-gray-700">
        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider text-center">
          India (UPI / GPay / PhonePe)
        </div>

        <div class="flex flex-col items-center justify-center space-y-2 py-1">
          <div class="bg-white p-2.5 rounded-xl shadow-md inline-block">
            <img id="upiQrImage" src="" alt="Scan UPI QR Code" class="w-36 h-36 mx-auto" />
          </div>
          <p class="text-[11px] text-gray-400 text-center">
            Scan with any UPI App (GPay / PhonePe / Paytm)
          </p>
        </div>

        <a
          id="upiDeepLink"
          href="#"
          class="block text-center w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-semibold rounded-lg text-white transition text-sm shadow"
        >
          📱 Pay via UPI App
        </a>

        <div class="flex items-center justify-between bg-gray-950/70 p-2 rounded-lg border border-gray-700">
          <span id="upiIdDisplay" class="text-xs font-mono text-gray-200 truncate select-all"></span>
          <button
            type="button"
            onclick="copyUpiId()"
            class="ml-2 px-2.5 py-1 text-xs bg-gray-800 hover:bg-gray-700 text-indigo-300 rounded font-medium transition border border-gray-600"
          >
            Copy
          </button>
        </div>
        <p id="copyStatus" class="text-[11px] text-emerald-400 text-center hidden">Copied to clipboard!</p>
      </div>

      <div class="space-y-2 text-left bg-gray-800/80 p-3 rounded-xl border border-gray-700">
        <!-- <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider text-center">International</div> -->
        <a
          id="patreonLink"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          class="flex items-center justify-center gap-2 w-full py-2.5 bg-gradient-to-r from-pink-500 via-fuchsia-500 to-purple-600 hover:from-pink-400 hover:via-fuchsia-400 hover:to-purple-500 font-semibold rounded-lg text-white transition duration-200 text-sm shadow-lg shadow-fuchsia-900/30"
        >
          🌐 International? If yes support via Patreon
        </a>
      </div>
    </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const cfg = window.APP_CONFIG || {};
      const upiId = cfg.UPI_ID || "";
      const payeeName = cfg.PAYEE_NAME || "Creator Support";

      const upiText = document.getElementById("upiIdDisplay");
      const upiLink = document.getElementById("upiDeepLink");
      const qrImg = document.getElementById("upiQrImage");
      const patreonLink = document.getElementById("patreonLink");
      const copyButton = document.getElementById("copyUpiButton");
      const copyStatus = document.getElementById("copyStatus");

      upiText.textContent = upiId;

      if (upiId) {
        const upiUri = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(payeeName)}&tn=${encodeURIComponent("Creator Support")}&cu=INR`;
        upiLink.href = upiUri;
        qrImg.src = `https://quickchart.io/qr?text=${encodeURIComponent(upiUri)}&size=220&margin=1`;
      } else {
        upiLink.removeAttribute("href");
        upiLink.classList.add("pointer-events-none", "opacity-50");
        qrImg.alt = "UPI ID is not configured";
      }

      if (cfg.PATREON_URL) {
        patreonLink.href = cfg.PATREON_URL;
      } else {
        patreonLink.removeAttribute("href");
        patreonLink.classList.add("pointer-events-none", "opacity-50");
      }

      copyButton.addEventListener("click", async () => {
        if (!upiId) return;

        try {
          await navigator.clipboard.writeText(upiId);
          copyStatus.classList.remove("hidden");
          setTimeout(() => copyStatus.classList.add("hidden"), 2000);
        } catch {
          const tempInput = document.createElement("input");
          tempInput.value = upiId;
          document.body.appendChild(tempInput);
          tempInput.select();
          document.execCommand("copy");
          tempInput.remove();
          copyStatus.classList.remove("hidden");
          setTimeout(() => copyStatus.classList.add("hidden"), 2000);
        }
      });
    });
  </script>
</body>
</html>
